# Candydate script-only CronJobs → kubectl exec into seewin Pod (by label).
# LLM jobs stay in agents.yaml settings.schedules (CursorBridge tick).
# SA cursorbridge-flush: pods get/list/exec only — no statefulsets get.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: candydate-pass-ab-launch
  namespace: leantime
  labels:
    app: candydate
    component: pass-ab-launch
spec:
  schedule: "0 12 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: candydate
            component: pass-ab-launch
        spec:
          serviceAccountName: cursorbridge-flush
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: run
              image: ghcr.io/yoosungung/cursor-agent-runner:latest
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  set -eu
                  NS=leantime
                  POD=$(kubectl -n "$NS" get pod -l app=cursor-agent,persona=seewin \
                    -o jsonpath='{.items[0].metadata.name}')
                  kubectl -n "$NS" exec "$POD" -c agent-runner -- \
                    bash /cursor-home/.cursor/skills/candydate-cron/scripts/candydate_pass_ab_launcher.sh
---
